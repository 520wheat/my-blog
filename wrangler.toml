main = ".open-next/worker.js"
name = "520wheat"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "GUESTBOOK_DB"
database_name = "2025-blog-guestbook"
database_id = "39daf4c9-9e1f-4016-a782-2b93c6d7ea41"

[build]
command = "pnpm run build:cf"

[observability]
[observability.logs]
enabled = true
# 头部采样率，1 表示 100% 采样（所有请求都会被采样）
head_sampling_rate = 1
# 启用调用日志（记录每次函数调用）
invocation_logs = true
# 持久化日志到磁盘（本地开发时有用）
persist = true
